name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Checks
        run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest test checkModuleGraph :app:checkReleasePermissions assembleRelease --continue
      - name: APK size gate
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          size=$(stat -c%s "$apk")
          echo "APK: $apk = $size bytes"
          test "$size" -le 4194304

  instrumented:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest
