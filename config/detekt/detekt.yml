naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  ReturnCount:
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 120
complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable', 'Query']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Query', 'Insert', 'Update', 'Delete', 'Upsert', 'Transaction', 'Preview']
